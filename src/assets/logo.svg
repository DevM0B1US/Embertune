<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Embertune">
  <defs>
    <!-- hot-to-cool ember ramp (top → bottom) -->
    <linearGradient id="flame" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#ffdd66"/>
      <stop offset="0.42" stop-color="#ffab4e"/>
      <stop offset="0.78" stop-color="#fb7e35"/>
      <stop offset="1" stop-color="#ef5a21"/>
    </linearGradient>
    <!-- notehead runs a touch deeper -->
    <linearGradient id="head" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffb45e"/>
      <stop offset="0.55" stop-color="#fb7e35"/>
      <stop offset="1" stop-color="#dd4c17"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.46" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ff8a3c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="headClip">
      <path d="M330 344
               C 310 326 282 314 252 314
               C 244 300 218 294 196 302
               C 186 294 168 292 152 300
               C 108 318 88 364 94 412
               C 100 464 148 500 206 500
               C 264 500 322 468 330 416 Z"/>
    </clipPath>
  </defs>

  <!-- warm halo -->
  <ellipse cx="256" cy="272" rx="250" ry="250" fill="url(#halo)"/>

  <!-- spark -->
  <circle cx="460" cy="106" r="11" fill="#ffd25a"/>
  <circle cx="460" cy="106" r="20" fill="#ffd25a" opacity="0.3" filter="url(#soft)"/>

  <g>
    <!-- stem -->
    <rect x="288" y="112" width="36" height="270" rx="18" fill="url(#flame)"/>

    <!-- flame flag: ribbon lick, soft point -->
    <path fill="url(#flame)" d="M288 210
         C 280 160 296 106 336 82
         C 332 102 340 114 356 120
         C 406 140 434 184 432 232
         C 430 282 414 322 388 344
         C 402 300 402 252 380 218
         C 366 196 340 188 324 196
         L 324 218
         L 288 218 Z"/>

    <!-- notehead: melted flame blob, wider than tall -->
    <path fill="url(#head)" d="M330 344
         C 310 326 282 314 252 314
         C 244 300 218 294 196 302
         C 186 294 168 292 152 300
         C 108 318 88 364 94 412
         C 100 464 148 500 206 500
         C 264 500 322 468 330 416 Z"/>
    <!-- darker molten rim under the head -->
    <g clip-path="url(#headClip)">
      <path d="M70 434 C 120 490 210 506 272 486 C 314 472 336 446 344 424
               L 344 540 L 54 540 Z" fill="#a5330c" opacity="0.65" filter="url(#soft)"/>
      <ellipse cx="200" cy="412" rx="72" ry="42" fill="#ffd97a" opacity="0.45" filter="url(#soft)"/>
    </g>
  </g>
</svg>
