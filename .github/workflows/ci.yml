name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  rust:
    name: Rust (cargo check · cargo test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # the sandbox this code was authored in has no cargo — CI is the
      # first compile gate for backend changes
      - name: cargo check
        run: cargo check --all-targets
        working-directory: src-tauri
      - name: cargo test
        run: cargo test
        working-directory: src-tauri
