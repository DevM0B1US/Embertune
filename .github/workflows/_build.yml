# Reusable Embertune build. Called by build.yml (manual dispatch / manual
# tag pushes) and release.yml (automatic version-bump releases).
#
# WHY a reusable workflow instead of chaining on the tag: workflow runs
# triggered by the GITHUB_TOKEN (e.g. a tag pushed from release.yml) do
# NOT start other workflows — GitHub's anti-recursion rule. Calling this
# file directly from the release pipeline sidesteps that entirely.
#
# Target:
#   Linux (Debian/Fedora/Arch & others) … .deb / .rpm / .AppImage
#
# NO Windows leg: the backend speaks mpv's JSON IPC over a Unix socket
# (std::os::unix) and stores data under ~/.local/share — it cannot
# compile on Windows. Windows support needs a named-pipe IPC layer and
# is tracked as future work; re-add a windows matrix leg here once the
# backend is portable.
name: build-reusable

on:
  workflow_call:
    inputs:
      release:
        description: "Publish a GitHub release with installers (else build-only)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-deb-rpm-appimage
            bundles: "deb,rpm,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          # release only when the caller asked for it; test runs are build-only
          tagName: ${{ inputs.release && 'v__VERSION__' || '' }}
          releaseName: ${{ inputs.release && 'Embertune v__VERSION__' || '' }}
          releaseBody: "Embertune installers for Linux. .deb (Debian/Ubuntu) · .rpm (Fedora/RHEL) · .AppImage (Arch & any distro). Runtime needs yt-dlp, ffmpeg and mpv (apt install them on Debian/Ubuntu; pacman/xdg-install on Arch)."
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embertune-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
