# Manual Embertune build.
#
# · Manual dispatch → build-only run (artifacts attached to the workflow,
#   no release) for testing the pipeline.
# · Pushing a tag `v*` BY HAND → builds every target and publishes the
#   GitHub release with installers attached.
#
# Automatic releases don't come through here — release.yml detects version
# bumps on main and calls _build.yml directly (a GITHUB_TOKEN-pushed tag
# can't trigger this workflow; see _build.yml's header).
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit
