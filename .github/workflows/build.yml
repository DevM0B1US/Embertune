# Embertune release builds.
#
# · Push a tag `v*`  → builds every target and publishes a GitHub release
#   with the installers attached.
# · Manual dispatch → build-only run (artifacts attached to the workflow,
#   no release) for testing the pipeline.
#
# Targets:
#   Linux (Debian/Ubuntu) …… .deb
#   Linux (Fedora/RHEL) ……... .rpm
#   Linux (Arch & others) …... .AppImage (runs on any distro, incl. Arch)
#   Windows ……………………..…... -setup.exe (NSIS) + .msi (WiX)
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-deb-rpm-appimage
            bundles: "deb,rpm,appimage"
          - os: windows-latest
            label: windows-nsis-msi
            bundles: "nsis,msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          # release only for tag pushes; dispatch runs are build-only
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Embertune v__VERSION__' || '' }}
          releaseBody: "Embertune installers. Linux: .deb (Debian/Ubuntu) · .rpm (Fedora) · .AppImage (Arch & any distro). Windows: -setup.exe (NSIS) and .msi. Runtime needs yt-dlp, ffmpeg and mpv on Linux (apt install them on Debian/Ubuntu; pacman/xdg-install on Arch)."
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embertune-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
